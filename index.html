<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>创北GAL GAME（九霄线已一半实装）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: text;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0a0f1e 0%, #0c1222 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Noto Sans CJK SC', 'Roboto', 'Helvetica Neue', sans-serif;
            padding: 20px;
            position: relative;
        }

        .game-container {
            width: 100%;
            max-width: 950px;
            background: rgba(20, 25, 40, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 48px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            transition: all 0.2s ease;
        }

        .game-bg-decoration {
            background: radial-gradient(ellipse at 20% 30%, rgba(90, 130, 200, 0.25), transparent 70%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #FFF5E6;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
            padding: 1rem 0 0.8rem 0;
        }

        .game-title-main {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #FFE6B0, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: none;
            margin-bottom: 6px;
        }
        .game-title-sub {
            font-size: 0.9rem;
            opacity: 0.9;
            letter-spacing: 2px;
            border-top: 1px solid rgba(255,200,100,0.5);
            padding-top: 6px;
            display: inline-block;
            color: #f0e2c5;
        }

        .affection-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            background: rgba(0,0,0,0.5);
            padding: 8px 20px;
            border-radius: 40px;
            margin: 8px 16px 0 16px;
            backdrop-filter: blur(4px);
            font-size: 0.85rem;
            font-weight: bold;
            flex-wrap: wrap;
        }
        .affection-item {
            color: #FFE6B0;
            letter-spacing: 1px;
        }
        .affection-item span {
            color: #ffaa66;
            font-weight: bold;
            margin-left: 6px;
            background: #1e1a2f;
            padding: 2px 8px;
            border-radius: 40px;
        }

        .dialogue-area {
            min-height: 380px;
            max-height: 480px;
            overflow-y: auto;
            padding: 28px 32px;
            scroll-behavior: smooth;
            background: rgba(0, 0, 0, 0.4);
            margin: 10px 16px 16px 16px;
            border-radius: 32px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3), 0 1px 0 rgba(255,255,255,0.05);
        }

        .dialogue-area::-webkit-scrollbar {
            width: 6px;
        }
        .dialogue-area::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
        }
        .dialogue-area::-webkit-scrollbar-thumb {
            background: #ffd966;
            border-radius: 8px;
        }

        .dialogue-line {
            font-size: 1.25rem;
            line-height: 1.65;
            color: #f3efe7;
            text-shadow: 1px 1px 2px black;
            margin-bottom: 1.25rem;
            letter-spacing: 0.02em;
            animation: fadeSlideUp 0.28s ease-out;
            border-left: 3px solid #ffb347;
            padding-left: 18px;
        }

        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 28px 28px 28px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .advance-area {
            flex: 2;
            display: flex;
            justify-content: center;
        }

        .click-hint {
            background: rgba(255, 200, 100, 0.2);
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 10px 24px;
            font-size: 0.9rem;
            color: #ffdfaa;
            border: 1px solid rgba(255, 210, 110, 0.5);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
        }

        .click-hint:hover {
            background: rgba(255, 200, 100, 0.4);
            color: #fff2df;
            transform: scale(0.98);
        }

        .reset-btn, .sponsor-btn {
            background: #2a2f3f;
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #f5e7ce;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            font-family: inherit;
            backdrop-filter: blur(2px);
            border: 1px solid #5f6b7e;
        }
        .sponsor-btn {
            background: #3f2e2c;
            border-color: #ffb347;
            color: #ffefcf;
        }
        .reset-btn:hover {
            background: #3f455b;
            color: #fff0dd;
            border-color: #ffb966;
        }
        .sponsor-btn:hover {
            background: #634e4a;
            border-color: #ffcc88;
            transform: scale(0.97);
        }
        
        .progress-indicator {
            background: #1e2438b3;
            border-radius: 40px;
            padding: 5px 18px;
            font-size: 0.85rem;
            color: #cdd9ff;
            font-family: monospace;
            letter-spacing: 1px;
        }

        .game-container {
            cursor: pointer;
        }

        .dialogue-area {
            cursor: text;
        }

        .option-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 3000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
        }
        .option-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .option-card {
            background: linear-gradient(145deg, #1f253e, #141a2c);
            border-radius: 48px;
            padding: 30px 32px;
            max-width: 500px;
            width: 85vw;
            border: 1px solid rgba(255,200,100,0.6);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        .option-card h3 {
            font-size: 1.8rem;
            background: linear-gradient(135deg, #FFE6B0, #FFB347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin-bottom: 20px;
        }
        .option-buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 10px;
        }
        .option-btn {
            background: #2e3440;
            border: none;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #FFE6B0;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            border: 1px solid #ffb34788;
        }
        .option-btn:hover {
            background: #ffb347;
            color: #1e1b1a;
            transform: scale(0.98);
            border-color: #fff0c0;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s ease;
        }
        .modal-overlay.active {
            visibility: visible;
            opacity: 1;
        }
        .modal-card {
            background: rgba(25, 30, 45, 0.95);
            border-radius: 48px;
            max-width: 85vw;
            width: 550px;
            border: 1px solid rgba(255, 200, 100, 0.5);
            box-shadow: 0 30px 40px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,240,0.1);
            padding: 30px 28px;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        .sponsor-list {
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            text-align: left;
            background: rgba(0,0,0,0.3);
            border-radius: 32px;
            padding: 12px 20px;
        }
        .sponsor-list p {
            color: #f5e7ce;
            font-size: 1rem;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,200,100,0.3);
        }
        .modal-buttons {
            display: flex;
            gap: 18px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }
        .modal-btn {
            background: #3a2e2a;
            border: none;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: bold;
            color: #ffeaC5;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9rem;
            border: 1px solid #ffb347;
        }
        .modal-btn-primary {
            background: #ffb347;
            color: #1e1b1a;
            border: none;
        }
        .sponsor-img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 32px;
            margin: 15px 0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            border: 1px solid #ffcc88;
        }
        .easter-egg-toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #f9d976, #f39f86);
            color: #1f1b15;
            padding: 20px 32px;
            border-radius: 60px;
            font-size: 1.4rem;
            font-weight: bold;
            text-align: center;
            white-space: nowrap;
            z-index: 10000;
            box-shadow: 0 0 0 4px rgba(255,215,0,0.6);
            backdrop-filter: blur(8px);
            font-family: monospace;
            animation: eggPop 0.4s cubic-bezier(0.34, 1.2, 0.64, 1), eggFade 3s ease forwards;
            pointer-events: none;
        }
        @keyframes eggPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
            70% { opacity: 1; transform: translate(-50%, -50%) scale(1.08); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        @keyframes eggFade {
            0% { opacity: 1; visibility: visible; }
            80% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        .ending-card {
            background: rgba(0,0,0,0.8);
            border-radius: 40px;
            padding: 28px;
            margin-top: 20px;
            text-align: center;
            border: 2px solid #ffb347;
            animation: fadeSlideUp 0.6s ease;
        }
        .ending-title {
            font-size: 2rem;
            color: #ffd966;
            margin-bottom: 16px;
        }
        @media (max-width: 640px) {
            .dialogue-line { font-size: 1rem; }
            .option-btn { font-size: 0.9rem; }
        }
    </style>
</head>
<body>
<div class="game-container" id="gameContainer">
    <div class="game-bg-decoration">
        <div class="game-title-main">创北GAL GAME欠费版</div>
        <div class="game-title-sub" id="startHintSub">⚡ 点击任意处开始正文 ⚡</div>
    </div>
    <div class="affection-bar" id="affectionBar">
        <div class="affection-item">❤️ 九霄好感: <span id="affJX">0</span></div>
        <div class="affection-item">🌿 孜然好感: <span id="affZR">0</span></div>
        <div class="affection-item">✏️ 句号好感: <span id="affJH">0</span></div>
    </div>
    <div class="dialogue-area" id="dialogueArea"></div>
    <div class="action-bar">
        <div class="progress-indicator" id="progressText">📜 序章</div>
        <div class="advance-area">
            <div class="click-hint" id="clickAdvanceBtn">▶ 点击继续 · 下一句</div>
        </div>
        <div style="display: flex; gap: 12px;">
            <button class="reset-btn" id="resetBtn">⟳ 重新开始</button>
            <button class="sponsor-btn" id="sponsorListBtn">🌟 赞助者名单</button>
        </div>
    </div>
</div>

<div id="optionModal" class="option-overlay">
    <div class="option-card">
        <h3>✨ 内心抉择 ✨</h3>
        <div id="optionText" style="color:#f0e2c5; margin-bottom: 20px;">你的选择将牵动命运的丝线...</div>
        <div id="optionButtonsContainer" class="option-buttons"></div>
    </div>
</div>

<div id="sponsorModal" class="modal-overlay">
    <div class="modal-card">
        <h3>✨ 赞助本项目的人 ✨</h3>
        <div class="sponsor-list" id="sponsorListContainer"></div>
        <div class="modal-buttons">
            <button class="modal-btn" id="closeSponsorModalBtn">🏠 回到主界面</button>
            <button class="modal-btn modal-btn-primary" id="openSponsorImageBtn">🎁 打开赞助界面</button>
        </div>
        <div class="sponsor-note">感谢每一位热心的朋友</div>
    </div>
</div>

<div id="sponsorImageModal" class="modal-overlay">
    <div class="modal-card image-modal-content">
        <h3>❤️ 赞助支持展台 ❤️</h3>
        <img id="sponsorDisplayImg" class="sponsor-img" src="thanks.jpg" alt="赞助感谢图" onerror="this.style.display='none'">
        <div class="modal-buttons">
            <button class="modal-btn close-img-only" id="closeImageModalBtn">🔙 关闭赞助界面</button>
        </div>
        <div class="sponsor-note">每一份支持都让世界变得更加温柔</div>
    </div>
</div>

<script>
    // ======================= 剧本（包含完整主线，选项触发点）======================
    const SCRIPT = [
            "观前提示：<br>本作中所有角色均已成年，并且无任何不良暗示，请注意甄别。剧情中的所有文本均可直接复制。<br>因为写代码的那个人懒，没有测试手机端阅读功能是否正常，因此出现了bug可以直接去私信说明。<br>已经将选项系统给做好了，但是因为其他线路一个字都还没写，所以目前一个选项都没有，只能默认进入九霄线，同时也是因为还缺少了相当大一堆的文本的原因导致了衔接可能有点问题，等我慢慢补吧。<br>特别鸣谢：<br>（目前还没想好写谁）",
            "如果你能够看到这串按理来说看不到的文字，那就说明你偷看我的源代码了。",

            "北笙觉得自己的人生大概就是一碗放凉了的白粥。<br>温吞、寡淡，毫无惊喜。",
            "此刻他正坐在大学教室的最后一排，百无聊赖地转着笔。<br>讲台上老教授的声音忽远忽近，像一台信号不好的收音机。<br>他说的每个字他都听得懂，但是一旦连起来就死活听不懂了。",
            "窗外阳光正好，照在他那张扔进人堆里绝对找不出来的脸上。<br>不算帅也不算丑，不算高也不算矮，成绩不算好也不算差，整个人生就是一部名为《普通》的纪录片。",
            "他的手机震了一下。",
            "他低头扫了一眼屏幕，嘴角抽了抽。",
            "备注名赫然写着“祖宗”。<br>这是他自己改的，虽然每次被发现都会被改回“哥哥”，但他还是会趁她不注意再改回去。",
            "消息就一句话：“哥，今晚我煮了汤。回来喝。”",
            "北笙盯着屏幕沉默了三秒，然后默默往窗外看了一眼。太阳确实是打西边落下去的，没有从东边升起来",
            "北笙低头准备给“祖宗”回消息。",
            "「又在看你那个妹妹的消息？」",
            "旁边传来一个凉飕飕的声音。",
            "北笙不用扭头都知道是谁。",
            "奇末，他同班同学，坐他隔壁，一张嘴被老天爷开过光——专克一切矫情和妄想。",
            "「你知道吗？你每次看你妹的消息都像一个中了彩票但不知道去哪兑奖的傻子，」",
            "奇末推了推眼镜，语气平淡得像在念课文。",
            "「不过也合理，你上辈子大概率是捐了一座庙，不然解释不了为什么你这种人能有个顶流妹妹。」",
            "「你就不能说点好听的。」",
            "「实话都不好听。」",
            "这话倒是真的。奇末这人嘴毒，但毒的都是实话。",
            "上个月北笙交了一篇作业，自己觉得写得还行，奇末看了三秒就觉得不行，然后花了两个小时帮他重新整理了框架。",
            "期末成绩出来，那门课北笙拿了A。<br>奇末知道了之后只回了一句「还行，说明你不是完全没救，只是九成没救。」",
            "北笙有时候觉得奇末是老天爷派来磨练他心态的。",
            "他正要回消息，余光瞥见一个女生正抱着手机疯狂打字，嘴角扬起的弧度让北笙本能地觉得不太妙。",
            "是句号，同样是他的同班同学。<br>平时安安静静坐在那里，看着就是个乖巧文静的好学生。",
            "但你只要走近一看就会发现，她手机屏幕上赫然是两个二次元美少年深情对视的画面。",
            "「你在看什么?」",
            "「“没什么呀。」",
            "句号抬起头，笑容纯洁得像个天使。",
            "北笙太了解这种眼神了。",
            "上次她露出这个眼神之后，第二天某个同好群里就多了一篇热度爆表的同人文。<br>虽然名字用的都是化名，但北笙怎么看怎么觉得那个“普通男大学生vs当红偶像妹妹”的设定多少有点吻合了。",
            "他默默把椅子往远离句号的方向挪了二十厘米。",
            "句号注意到了这个动作，微微一笑，把椅子往他那边挪了二十厘米。",
            "北笙放弃挣扎，低头回消息：“好。汤里别放香菜。”",
            "对面秒回了一个小猫点头的表情包。",
            "北笙看着那个可可爱爱的头像，想了半天，还是没想明白舞台上光芒万丈的那个人，和在他家厨房里笨手笨脚切菜的妹妹，到底哪个才是真的。",
            "可能两个都是。<br>也可能对他来说，后面那个更真一点。",
            "与此同时，城市的另一端。",
            "放学铃响过十分钟了，教室里人走得七七八八。九霄坐在座位上，低头看着手机屏幕上的那个“好”字，嘴角弯了一下。",
            "就一下。然后她飞快地收起了表情，把手机塞进校服口袋，开始收拾书包。",
            "「九霄同学。」",
            "后桌传来的声音明亮又爽朗，带着一点少年人特有的朝气。",
            "一个男孩单手托腮，歪着头看她，笑得像窗外的夕阳一样灿烂。<br>任何人看到这个笑容，都会觉得这大概就是“阳光开朗大男孩”这个形容词的完美样本。",
            "「你看上去好像今天心情很好的样子哦，有什么好事吗？」",
            "九霄头也没回，语气平淡得像在对空气说话。",
            "「没什么。」",
            "「是吗。」",
            "长夜的笑容没变，目光却从九霄的后颈一寸一寸地滑过，最后落在她塞手机的那个校服口袋上。",
            "「九霄同学今天走得好早。平时不是都要多留一会儿吗？今天社团不排练？」",
            "「不排。有事。」",
            "「什么事呀？这么着急。」",
            "长夜的嘴角又弯了弯，手指无意识地摩挲着笔杆。",
            "他的眼睛在笑，但眼底深处有什么东西不太对劲。像是表面平静的湖面底下沉着某种黑色的、缓慢涌动的东西，被一层薄薄的笑意勉强盖住了。",
            "「回家做饭。」",
            "「做饭？你还会做饭？看不出来。给谁做？」",

        "围裙系在腰上的动作行云流水。煎蛋在平底锅里滋滋地响着，边缘微微焦黄，她熟练地翻了个面，顺手把牛奶倒进锅里温着。",
        "她一边哼着自己新单曲的旋律，一边继续做着早餐，哼到副歌部分的时候记起来是首情歌，耳根又悄悄地红了。",
        "「哥哥，起床啦。」",
        "她回到床边，俯下身子，声音温柔地说。顺手把被子往下拉了拉，露出北笙睡得乱糟糟的头发。",
        "北笙迷迷糊糊地睁开眼，阳光逆着九霄的身影洒下来，她整个人都被镀上了一层淡淡的光。他眨了眨眼，恍惚间觉得这辈子大概就是为了每天早上的这个瞬间。",
        "早餐很安静。",
        "九霄用叉子戳着煎蛋，蛋黄液慢慢淌出来，她也不急着吃，眼神时不时地飘向对面正埋头吃着的北笙，嘴角的弧度怎么都压不下去。",
        "北笙自然注意到了，但没有戳穿她。",
        "吃完早餐后，两人准备去上学了。",
        "九霄站在玄关，手扶着鞋柜，左脚已经踩上了小皮鞋，却突然不动了。",
        "她扯住北笙的袖子，仰起头。晨光里她的眼睛亮得像蓄了一汪水，声音又软又黏，像在撒娇又像在理所当然地讨要着什么。",
        "「哥哥，人家想要那个嘛。」",
        "北笙系鞋带的手顿了一下。",
        "「哪个？」",
        "九霄的脸上浮起一层薄红，却没有移开视线，眼睛亮晶晶地盯着他，像是在盯着一颗很想吃到的糖果。",
        "北笙心里清楚得很，但还是忍不住想逗她。他嘴角微微上扬，明知故问。",
        "「你不说出来我怎么知道？」",
        "九霄的脚轻轻跺了一下地板。",
        "但是北笙还是装作一副什么都不知道的样子看着她。",
        "「就是……<ruby>mua<rt>亲亲</rt></ruby>啦！」",
        "她几乎是喊出来的，尾音却在一半的地方软了下去。脸红得像要烧起来，却还要嘴硬般地瞪着北笙。",
        "「为什么非要人家说出来啊，哥哥坏！」",
        "北笙终于没忍住笑出了声。他弯下腰，一只手扶住她的肩膀，在她额头上轻轻印下一个吻。然后顿了顿，又飞快地偏过头，在她嘴角处落下了第二个。",
        "九霄的耳朵红透了。但她却并没有躲,同时用手偷偷地摸了一下北笙的口袋。",
        "「这还差不多嘛……」",
        "她小声嘟囔着，声音闷在围巾里，但眼睛里的光怎么都藏不住。",
        "两个人磨蹭了半天，终于出了门。",
        "楼道里北笙推着他那辆破旧的自行车，链条发出咔嗒咔嗒的声响。",
        "九霄走在他身后，踩着他的影子，两个人在狭窄的楼梯间一前一后地往下走。",
        "出了小区门口，一个向左，一个向右，往同一个城市的不同方向。",
        "北笙骑着自行车往XX大学赶。那是一所说不上好也说不上坏的学校，跟他的成绩一样，平平无奇，普普通通。",
        "春风灌进他的校服袖子，鼓鼓囊囊的，他一只手扶着车把，另一只手无意识地在口袋里摸了摸。",
        "那里有早晨九霄悄悄塞进去的一颗奶糖。",
        "九霄要坐地铁去YY中学。那是全市数一数二的重点中学，她穿着校服裙站在站台上，旁边的大叔认出了她，激动地掏出手机拍照。",
        "她条件反射般地露出标准的偶像微笑，心里却在想她的哥哥现在走到哪里了，会不会迟到。",
        "今天实在踩不上点了。",
        "北笙和九霄两人几乎同时如此想到。",
        "九霄几乎是贴着上课铃冲进教室的。她气喘吁吁地站在门口，胸口还在剧烈起伏，额前的碎发被汗粘在皮肤上。",
        "班主任推了推眼镜，镜片反了一下光。",
        "「九霄同学，你又迟到了。」",
        "她的声音不大，但教室里安静得能听见窗外操场上体育课的哨声。",
        "「虽然你是偶像，但学校有学校的规定。」",
        "九霄低下头，刘海遮住了大半张脸。班主任以为她在反省，其实她的嘴角正偷偷地翘起来。然后她在心里把哥哥骂了三遍——不对，是四遍。",
        "而北笙在大学那边也好不到哪里去。",
        "阶梯教室里教授已经开始点名，他猫着腰从后门溜进来，书包带子从肩膀上滑下去，手忙脚乱地去接，发出不小的动静。室友回过头来嘲笑他。",
        "「又、迟、到、啊、臭、妹、控。」",
        "北笙瞪了他一眼，在旁边的座位上坐下来，翻开课本才发现拿错了。",
        "早上出门太急，他拿的是九霄的笔记本。",
        "翻开第一页，是她工工整整的字迹：「笨蛋哥哥专用记事本。」，旁边还画了个气鼓鼓的小人。",
        "他的手指在那一行字上停了一会儿，然后慢慢弯起嘴角。",
        "窗外，五月初的风轻轻吹过，吹动了两扇不同方向窗户的窗帘。这个城市的东边和西边，两个正在上课的人，在同一秒不约而同地抬起头看了一眼窗外。",
        "然后又在同一秒，不约而同地想——",
        "「明天，明天一定早点出门。」"
    ];

    const MAIN_LINES = SCRIPT.filter(line => !line.startsWith("[OPT:"));
    const MAIN_TOTAL = MAIN_LINES.length - 2;
    const JIOUXIAO_TOTAL = JIOUXIAO_ENDING_LINES.length;
    let mainIdx = 2;
    let displayedCount = 0;
    let isDisclaimer = true;
    let waitingOption = false;
    let branchActive = false;
    let branchQueue = [];
    let afterBranch = null;
    let gameFinished = false;
    let postEndClicks = 0;
    let eggShown = false;
    let endingDisplayed = false;
    let branchTotalLines = 0;
    let branchDisplayed = 0;
    let affection = { jiuxiao: 0, ziran: 0, juhao: 0 };
    const dialDiv = document.getElementById('dialogueArea');
    const progressSpan = document.getElementById('progressText');
    const resetBtn = document.getElementById('resetBtn');
    const advanceBtn = document.getElementById('clickAdvanceBtn');
    const container = document.getElementById('gameContainer');
    const startHint = document.getElementById('startHintSub');
    const optModal = document.getElementById('optionModal');
    const optText = document.getElementById('optionText');
    const optBtns = document.getElementById('optionButtonsContainer');
    const affJXSpan = document.getElementById('affJX');
    const affZRSpan = document.getElementById('affZR');
    const affJHSpan = document.getElementById('affJH');

    function updateAffUI() {
        affJXSpan.innerText = affection.jiuxiao;
        affZRSpan.innerText = affection.ziran;
        affJHSpan.innerText = affection.juhao;
    }
    function addAff(ch, delta) {
        affection[ch] += delta;
        updateAffUI();
    }

    function appendText(html, countAsMain = true) {
        const line = document.createElement('div');
        line.className = 'dialogue-line';
        line.innerHTML = html;
        dialDiv.appendChild(line);
        dialDiv.scrollTop = dialDiv.scrollHeight;
        if (countAsMain && !isDisclaimer && !gameFinished && !branchActive) {
            displayedCount++;
            updateProgress();
        }
    }

    function updateProgress() {
        if (isDisclaimer) {
            progressSpan.innerText = `未开始 / ${MAIN_TOTAL}`;
        } else if (branchActive && branchTotalLines > 0) {
            progressSpan.innerText = `九霄线 ${branchDisplayed} / ${branchTotalLines} 🌸`;
        } else if (gameFinished) {
            progressSpan.innerText = `故事终章 ✨`;
        } else {
            progressSpan.innerText = `📜 ${displayedCount} / ${MAIN_TOTAL}`;
        }
    }

    function showDisclaimer() {
        dialDiv.innerHTML = '';
        appendText(MAIN_LINES[0], false);
        const hint = document.createElement('div');
        hint.className = 'dialogue-line';
        hint.style.borderLeftColor = '#ffd58c';
        hint.style.opacity = '0.85';
        hint.innerHTML = '🌸 点击画面或「点击继续」按钮，清空提示并开启完整剧情 🌸';
        dialDiv.appendChild(hint);
        dialDiv.scrollTop = 0;
        updateProgress();
    }

    function startBranch(lines, onFinish, isJiuxiaoBranch = false) {
        if (!lines.length) { if(onFinish) onFinish(); return; }
        branchActive = true;
        branchQueue = [...lines];
        afterBranch = onFinish;
        if (isJiuxiaoBranch) {
            branchTotalLines = lines.length;
            branchDisplayed = 0;
        } else {
            branchTotalLines = 0;
        }
        updateProgress();
    }

    function advanceBranch() {
        if (!branchActive || branchQueue.length === 0) {
            branchActive = false;
            branchTotalLines = 0;
            updateProgress();
            if (afterBranch) {
                let cb = afterBranch;
                afterBranch = null;
                cb();
            }
            return false;
        }
        const line = branchQueue.shift();
        const lineDiv = document.createElement('div');
        lineDiv.className = 'dialogue-line';
        lineDiv.innerHTML = line;
        dialDiv.appendChild(lineDiv);
        dialDiv.scrollTop = dialDiv.scrollHeight;
        if (branchTotalLines > 0) {
            branchDisplayed++;
            updateProgress();
        }
        if (branchQueue.length === 0) {
            setTimeout(() => {
                if (branchActive && branchQueue.length === 0) {
                    branchActive = false;
                    branchTotalLines = 0;
                    updateProgress();
                    if (afterBranch) {
                        let cb = afterBranch;
                        afterBranch = null;
                        cb();
                    }
                }
            }, 50);
        }
        return true;
    }

    function showOptionDialog(title, options, onSelect) {
        waitingOption = true;
        optText.innerText = title;
        optBtns.innerHTML = '';
        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => {
                optModal.classList.remove('active');
                if (opt.onSelect) opt.onSelect();
                if (onSelect) onSelect(opt.value);
                waitingOption = false;
            };
            optBtns.appendChild(btn);
        });
        optModal.classList.add('active');
    }

    // 选项1
    function showFirstChoice() {
        showOptionDialog("面对奇末的吐槽，你心中更在意谁？", [
            { text: "💖 九霄——想起厨房里的温暖背影", value: "jiuxiao", onSelect: () => {
                addAff('jiuxiao', 2);
                startBranch(["✨ 你想起九霄穿着你的卫衣认真煲汤的样子，胸口涨满了柔软的暖意。"], () => {});
            } },
            { text: "🌿 孜然——冷淡外表下的细腻", value: "ziran", onSelect: () => {
                addAff('ziran', 2);
                startBranch(["🍃 脑海里飘过孜然帮你补习功课时不经意露出的认真侧脸，莫名让人心跳。"], () => {});
            } },
            { text: "✏️ 句号——古灵精怪的二次元同好", value: "juhao", onSelect: () => {
                addAff('juhao', 2);
                startBranch(["📖 句号推了推眼镜朝你意味深长地笑，仿佛又在脑补新的同人设定，气氛忽然欢脱起来。"], () => {});
            } }
        ]);
    }

    // 选项2
    function showSecondChoice() {
        showOptionDialog("你的心意开始萌动，你想要靠近谁？", [
            { text: "🌟 九霄——想守护她的日常", value: "jiuxiao", onSelect: () => {
                addAff('jiuxiao', 2);
                startBranch(["🥣 九霄发来新消息：哥，汤里加了玉米，快点回来。你嘴角不自觉上扬。"], () => {});
            } },
            { text: "🍂 孜然——想融化她冰冷下的温柔", value: "ziran", onSelect: () => {
                addAff('ziran', 2);
                startBranch(["🍬 孜然路过你身边时悄悄放下一颗薄荷糖，面无表情却耳根微红。"], () => {});
            } },
            { text: "✍️ 句号——有趣的灵魂万里挑一", value: "juhao", onSelect: () => {
                addAff('juhao', 2);
                startBranch(["📝 句号塞给你一张纸条：今晚有空吗？给你看个好东西（新坑主角原型是你哦~）"], () => {});
            } }
        ]);
    }

    function playJiuxiaoEnding() {
        if (endingDisplayed) return;
        endingDisplayed = true;
        startBranch(JIOUXIAO_ENDING_LINES, () => {
            gameFinished = true;
            branchActive = false;
            branchTotalLines = 0;
            updateProgress();
            appendText("<br>✨ 九霄线 · 完 ✨<br>感谢你的陪伴，故事永不落幕。", false);
        }, true);
    }

    function finishGameEarly() {
        if (endingDisplayed) return;
        endingDisplayed = true;
        gameFinished = true;
        appendText("<br>✨ 故事已经结束，点击重置可重复观看 ✨", false);
        updateProgress();
    }

    function triggerEnding() {
        if (gameFinished || endingDisplayed) return;
        let maxAff = Math.max(affection.jiuxiao, affection.ziran, affection.juhao);
        if (maxAff < 3) {
            playJiuxiaoEnding();
            return;
        }
        let topChar = null;
        if (affection.jiuxiao === maxAff) topChar = 'jiuxiao';
        else if (affection.ziran === maxAff) topChar = 'ziran';
        else if (affection.juhao === maxAff) topChar = 'juhao';
        
        if (topChar === 'jiuxiao') {
            playJiuxiaoEnding();
        } else {
            let confirmMsg = `作者暂未完成该角色路线的剧情。\n是否观看已完成的「九霄线」完整故事？\n\n点击“确定”进入九霄线，点击“取消”结束游戏（之后可触发彩蛋）。`;
            if (window.confirm(confirmMsg)) {
                playJiuxiaoEnding();
            } else {
                finishGameEarly();
            }
        }
    }

    let rawPos = 2;
    function advanceMain() {
        if (gameFinished) return;
        while (rawPos < SCRIPT.length && SCRIPT[rawPos].startsWith("[OPT:")) {
            const marker = SCRIPT[rawPos];
            rawPos++;
            if (marker === "[OPT:first]") {
                showFirstChoice();
                return;
            } else if (marker === "[OPT:second]") {
                showSecondChoice();
                return;
            }
        }
        if (mainIdx >= MAIN_LINES.length) {
            if (!gameFinished && !endingDisplayed) triggerEnding();
            return;
        }
        const line = MAIN_LINES[mainIdx];
        appendText(line, true);
        mainIdx++;
        rawPos++;
        if (mainIdx >= MAIN_LINES.length && !gameFinished && !endingDisplayed) {
            triggerEnding();
        }
    }

    function handleAdvance(e) {
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed) return;
        if (waitingOption) return;
        if (isDisclaimer) {
            startGame();
            return;
        }
        if (gameFinished) {
            postEndClicks++;
            if (postEndClicks === 10 && !eggShown) {
                eggShown = true;
                const eggDiv = document.createElement('div');
                eggDiv.className = 'easter-egg-toast';
                eggDiv.innerHTML = '我说结束了你尔多龙吗';
                document.body.appendChild(eggDiv);
                setTimeout(() => eggDiv.remove(), 5000);
            } else if (postEndClicks === 20) {
                const w = document.createElement('div');
                w.innerText = '💢还在点？ 你点你妈呢💢';
                w.style.cssText = 'position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:#1e1a2fcc; color:#ffbc6e; padding:6px 16px; border-radius:40px; font-size:0.75rem; backdrop-filter:blur(8px); z-index:998; pointer-events:none;';
                document.body.appendChild(w);
                setTimeout(() => w.remove(), 2000);
            }
            return;
        }
        if (branchActive) {
            advanceBranch();
            return;
        }
        if (mainIdx < MAIN_LINES.length) {
            advanceMain();
        } else {
            if (!gameFinished && !endingDisplayed) triggerEnding();
        }
    }

    function startGame() {
        if (!isDisclaimer) return;
        dialDiv.innerHTML = '';
        isDisclaimer = false;
        mainIdx = 2;
        rawPos = 2;
        displayedCount = 0;
        waitingOption = false;
        branchActive = false;
        branchQueue = [];
        afterBranch = null;
        gameFinished = false;
        endingDisplayed = false;
        postEndClicks = 0;
        eggShown = false;
        branchTotalLines = 0;
        branchDisplayed = 0;
        affection = { jiuxiao: 0, ziran: 0, juhao: 0 };
        updateAffUI();
        updateProgress();
        startHint.style.visibility = 'hidden';
        advanceBtn.style.opacity = "1";
        advanceMain();
    }

    function resetGame() {
        if (window.confirm("重置游戏会丢失所有好感度及进度，确定回到最初吗？")) {
            dialDiv.innerHTML = '';
            isDisclaimer = true;
            mainIdx = 2;
            rawPos = 2;
            displayedCount = 0;
            waitingOption = false;
            branchActive = false;
            branchQueue = [];
            afterBranch = null;
            gameFinished = false;
            endingDisplayed = false;
            postEndClicks = 0;
            eggShown = false;
            branchTotalLines = 0;
            branchDisplayed = 0;
            affection = { jiuxiao: 0, ziran: 0, juhao: 0 };
            updateAffUI();
            showDisclaimer();
            advanceBtn.style.opacity = "1";
            startHint.style.visibility = 'visible';
            optModal.classList.remove('active');
            document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
        }
    }

    const sponsors = ["南城北笙","鎏星划过长夜"];
    function renderSponsorList() {
        const cont = document.getElementById('sponsorListContainer');
        cont.innerHTML = '';
        sponsors.forEach(n => { const p = document.createElement('p'); p.textContent = n; cont.appendChild(p); });
    }
    document.getElementById('sponsorListBtn')?.addEventListener('click', () => document.getElementById('sponsorModal').classList.add('active'));
    document.getElementById('closeSponsorModalBtn')?.addEventListener('click', () => document.getElementById('sponsorModal').classList.remove('active'));
    document.getElementById('openSponsorImageBtn')?.addEventListener('click', () => document.getElementById('sponsorImageModal').classList.add('active'));
    document.getElementById('closeImageModalBtn')?.addEventListener('click', () => document.getElementById('sponsorImageModal').classList.remove('active'));
    document.getElementById('sponsorModal')?.addEventListener('click', (e) => { if(e.target === document.getElementById('sponsorModal')) document.getElementById('sponsorModal').classList.remove('active'); });
    document.getElementById('sponsorImageModal')?.addEventListener('click', (e) => { if(e.target === document.getElementById('sponsorImageModal')) document.getElementById('sponsorImageModal').classList.remove('active'); });

    document.addEventListener('copy', (e) => {
        const sel = window.getSelection();
        if (sel && !sel.isCollapsed) e.clipboardData.setData('text/plain', sel.toString());
        e.preventDefault();
    });
    advanceBtn.addEventListener('click', (e) => { e.stopPropagation(); handleAdvance(e); });
    container.addEventListener('click', (e) => {
        if (e.target.closest?.('.reset-btn') || e.target.closest?.('#clickAdvanceBtn') || e.target.closest?.('#sponsorListBtn')) return;
        handleAdvance(e);
    });
    resetBtn.addEventListener('click', (e) => { e.stopPropagation(); resetGame(); });
    renderSponsorList();
    console.log('你看你妈呢');
    resetGame();
</script>
</body>
</html>
